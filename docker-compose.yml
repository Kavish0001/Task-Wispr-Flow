services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      orchestrator:
        condition: service_healthy
  orchestrator:
    build: ./server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
